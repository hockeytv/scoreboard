<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HockeyTV Scoreboard</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&family=Roboto+Condensed:wght@400;500;700&family=Bebas+Neue&family=Anton&family=Archivo+Black&family=Noto+Sans+KR:wght@400;500;700;900&family=Black+Han+Sans&family=Do+Hyeon&family=Jua&family=Gothic+A1:wght@400;500;700;800;900&family=Nanum+Gothic:wght@400;700;800&family=Song+Myung&display=swap" rel="stylesheet">
<style>
/* 무료 한글 웹폰트 (눈누 제공 CDN) */
@font-face{font-family:'KotraBold';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-10-21@1.1/KOTRA_BOLD-Bold.woff') format('woff');font-weight:normal;font-display:swap}
@font-face{font-family:'KotraDoYak';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2110@1.0/KOTRALEAP.woff2') format('woff2');font-weight:normal;font-display:swap}
@font-face{font-family:'KotraHope';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2110@1.0/KOTRAHOPE.woff2') format('woff2');font-weight:normal;font-display:swap}
@font-face{font-family:'JalnanGothic';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_231029@1.1/JalnanGothic.woff') format('woff');font-weight:normal;font-display:swap}
@font-face{font-family:'Jalnan';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_four@1.2/JalnanOTF00.woff') format('woff');font-weight:normal;font-display:swap}
:root{
  --bg:#171b26; --panel:#20263a; --panel2:#2a3350; --line:#39415f;
  --txt:#e8ecf7; --muted:#9aa5c4; --accent:#6d5cf7; --ok:#18b884; --warn:#e0b020;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
body.viewmode{background:transparent!important;overflow:hidden}
button{font-family:inherit}

/* ============ CONTROL PANEL ============ */
.topbar{display:flex;gap:8px;align-items:center;justify-content:center;padding:10px;background:#11151f;border-bottom:1px solid var(--line);flex-wrap:wrap}
.btn{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:500}
.btn:hover{filter:brightness(1.2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#04281d}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.wide{width:100%}
.roompill{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:20px;padding:5px 12px}

.section{border:1px solid var(--line);margin:10px;border-radius:8px;overflow:hidden;background:var(--panel)}
.section>h3{margin:0;padding:8px 12px;background:#1a2033;font-size:13px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.section>.body{padding:12px}

/* preview */
#previewBody{background:#0d101c;padding:0;overflow:hidden}

/* controls grid */
.ctrlgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:8px;padding:8px}
.ctrlgrid>.cbox{min-width:0}
.cbox .subbtn,.cbox .tog,.cbox .bigbtn{white-space:normal;word-break:keep-all;line-height:1.25}
.cbox .tag{word-break:keep-all}
@media(max-width:430px){.ctrlgrid{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}}
/* 좁은 창(OBS 옆에 붙여놓고 쓸 때) — 네 칸이 모두 보이도록 촘촘하게 */
@media(max-width:900px){
 .topbar{padding:6px;gap:5px}
 .btn{padding:5px 9px;font-size:12px}
 .section{margin:6px}
 .section>h3{padding:6px 9px;font-size:12px}
 .section>.body{padding:8px}
 .cbox>h4{padding:4px;font-size:11px}
 .cbox>.b{padding:6px;gap:5px}
 .tag{font-size:10px;padding:1px 7px}
 .bigbtn{padding:9px;font-size:15px}
 .subbtn{padding:6px;font-size:12px}
 .tog{padding:7px;font-size:12px}
 .clockbig{font-size:26px;letter-spacing:1px}
 .hint{font-size:10px;line-height:1.4}
 .penrow{font-size:11px;gap:2px;padding:3px 4px}
 .penrow .ptime{font-size:13px;min-width:2.8em}
 .penrow .pb{padding:2px 5px;font-size:10px}
 .penadd{padding:6px;gap:5px}
 .penadd .row4 button{padding:7px 1px;font-size:12px}
 label.f{font-size:11px;margin:6px 0 2px}
 input[type=text],input[type=number],select,textarea{padding:6px;font-size:12px}
 .grid2,.grid3{grid-template-columns:1fr;gap:8px}
 table.logtbl{font-size:11px}
 table.logtbl th,table.logtbl td{padding:4px 5px}
 .brow{grid-template-columns:auto 1fr auto;padding:6px 8px;font-size:12px}
}
.cbox{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.cbox>h4{margin:0;padding:6px;text-align:center;font-size:12px;font-weight:700;letter-spacing:.5px;background:#1a2033}
.cbox>.b{padding:8px;display:flex;flex-direction:column;gap:6px}
.cbox.home>h4{background:#131a33;color:#f5c518}
.cbox.away>h4{background:#c01722;color:#fff}
.tag{align-self:center;background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:2px 10px;border-radius:5px}
.bigbtn{width:100%;padding:12px;font-size:16px;font-weight:700;border-radius:6px;border:1px solid var(--line);background:#e8ecf7;color:#111;cursor:pointer}
.bigbtn:active{transform:translateY(1px)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.subbtn{padding:8px;font-size:13px;border-radius:6px;border:1px solid var(--line);background:#111624;color:var(--txt);cursor:pointer}
.cbox.away .subbtn{background:#3d0b10}
.clockbig{text-align:center;font-family:"Oswald",monospace;font-size:34px;font-weight:700;letter-spacing:2px;padding:4px 0}
.penlist{display:flex;flex-direction:column;gap:4px}
.penrow{display:flex;align-items:center;gap:3px;background:#2b1030;border:1px solid #5b2a63;border-radius:5px;padding:4px 5px;font-size:13px;flex-wrap:wrap}
.penrow .pnum{min-width:2.2em}
.penrow .ptime{font-family:"Oswald",monospace;font-size:15px;min-width:3.1em;text-align:right}
.penrow .pb{padding:3px 6px;font-size:11px;border-radius:4px;border:1px solid var(--line);background:#141a2b;color:var(--txt);cursor:pointer;line-height:1.2}
.penrow .pb:hover{filter:brightness(1.4)}
.penrow .pb.del{background:#4a1414;border-color:#7a2a2a}
.penadd{border:1px solid var(--accent);border-radius:6px;padding:8px;background:#1a1b3a;display:flex;flex-direction:column;gap:6px}
.penadd .row4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.penadd .row4 button{padding:8px 2px;font-size:13px;font-weight:700;border-radius:5px;border:1px solid var(--line);background:#e8ecf7;color:#111;cursor:pointer}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:#20263ae8;border:1px solid var(--accent);color:var(--txt);padding:11px 18px;border-radius:8px;font-size:13.5px;max-width:560px;box-shadow:0 8px 24px #0008;animation:toastin .2s ease-out}
@keyframes toastin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.penrow b{font-family:"Oswald";font-size:15px}
.penrow .sp{flex:1}
.tog{width:100%;padding:9px;border-radius:6px;border:1px solid var(--line);background:#111624;color:var(--txt);cursor:pointer;font-size:13px;font-weight:600}
.tog.on{background:var(--ok);color:#04281d;border-color:var(--ok)}

/* setup */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
label.f{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
input[type=text],input[type=number],select,textarea{width:100%;background:#141a2b;border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:8px;font-size:13px;font-family:inherit}
input[type=color]{width:40px;height:32px;padding:2px;background:#141a2b;border:1px solid var(--line);border-radius:6px}
.inline{display:flex;align-items:center;gap:8px}
.sw{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px;cursor:pointer;user-select:none}
.sw input{display:none}
.sw i{width:34px;height:18px;border-radius:20px;background:#404a6b;position:relative;transition:.15s;flex:0 0 auto}
.sw i:after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked + i{background:var(--accent)}
.sw input:checked + i:after{left:18px}
.hint{font-size:11px;color:var(--muted);line-height:1.5}
.logoprev{width:38px;height:38px;object-fit:contain;background:#141a2b;border:1px solid var(--line);border-radius:6px}
.periodrow{display:grid;grid-template-columns:28px 1fr 90px 30px;gap:6px;align-items:center;margin-bottom:6px}
.copybox{display:flex;gap:6px;align-items:center;margin:4px 0}
.copybox input{font-size:11px;font-family:monospace}
.teamchip{display:flex;align-items:center;gap:6px;padding:5px;border:1px solid var(--line);border-radius:6px;background:#141a2b;margin-bottom:4px;font-size:12px}
.teamchip img{width:22px;height:22px;object-fit:contain}
.teamchip .sp{flex:1}

/* ============ SCOREBOARD RENDER ============ */
.sbwrap{display:inline-block;font-family:var(--sbfont,"Barlow Condensed"),"Noto Sans KR",sans-serif;line-height:1}
.sbwrap.center{display:block;text-align:center}
.sbwrap.center .sbmain,.sbwrap.center .sbunder{margin-left:auto;margin-right:auto}
.sbgrid{display:inline-grid;grid-template-columns:minmax(min-content,1fr) minmax(min-content,1fr) auto;column-gap:2px;row-gap:2px}
.sbside{display:flex;align-items:center;gap:.5em;padding:.28em .55em;min-width:8.2em;border-radius:3px}
.sblogo{height:2.15em;width:2.15em;object-fit:contain;flex:0 0 auto}
.sbnamecol{display:flex;flex-direction:column;justify-content:center;flex:1;min-width:0}
.sbname{font-size:1.55em;font-weight:700;letter-spacing:.01em;white-space:nowrap;text-transform:uppercase}
.sbrec{font-size:.92em;font-weight:700;opacity:.92;white-space:nowrap}
.sbscorecol{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;padding-left:.35em}
.sbscore{font-size:1.9em;font-weight:700;font-variant-numeric:tabular-nums}
.sbsog{font-size:.82em;font-weight:700;white-space:nowrap;opacity:.95}
.sbclock{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.28em .6em;min-width:3.6em;border-radius:3px}
.sbtime{font-size:1.9em;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.sbperiod{font-size:.95em;font-weight:700;opacity:.95}
.sbucol{display:flex;flex-direction:column;gap:2px}
.sbbanner{text-align:center;font-size:1.05em;font-weight:700;padding:.16em .3em;border-radius:3px}
.sbpen{text-align:center;font-size:1.35em;font-weight:700;padding:.06em;font-variant-numeric:tabular-nums;border-radius:3px}
.sbtitle{text-align:center;font-size:1.15em;font-weight:700;padding:.18em .9em;border-radius:3px;grid-column:1/4;justify-self:center}
.sbso{display:flex;align-items:center;justify-content:space-between;gap:.4em;padding:.14em .5em;border-radius:3px}
.sbso .dots{display:flex;align-items:center;gap:.22em}
.sbso .dot{width:.95em;height:.95em;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1em;line-height:1}
.sbso .dot b{font-size:.6em;font-weight:900}
.sbso .socount{font-size:1.35em;font-weight:700;font-variant-numeric:tabular-nums}
.stripe{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.10) 0 8px,transparent 8px 16px)}

/* full screen board */
.fsb{display:flex;flex-direction:column;align-items:center;gap:.3em;font-family:var(--sbfont,"Barlow Condensed"),sans-serif}
.fsbrow{display:flex;align-items:center;gap:.5em}
.fsbteam{display:flex;flex-direction:column;align-items:center;padding:.3em .6em;border-radius:6px;min-width:5.5em}
.fsbteam .n{font-size:2em;font-weight:700;text-transform:uppercase}
.fsbteam .s{font-size:6em;font-weight:700;line-height:.95;font-variant-numeric:tabular-nums}
.fsbmid{display:flex;flex-direction:column;align-items:center}
.fsbmid .t{font-size:4.4em;font-weight:700;font-variant-numeric:tabular-nums}
.fsbmid .p{font-size:1.5em;font-weight:700}

/* goal animation */
@keyframes blinkdot{0%,100%{opacity:1}50%{opacity:.15}}
.sbreplay{display:flex;align-items:center;justify-content:center;gap:.45em;font-size:1.15em;font-weight:700;
 padding:.18em 1em;border-radius:3px;grid-column:1/4;justify-self:center;letter-spacing:.08em;text-transform:uppercase}
.sbreplay i{width:.6em;height:.6em;border-radius:50%;background:currentColor;animation:blinkdot 1s infinite;font-style:normal}
.sbgrid.dimmed>*:not(.sbreplay){opacity:.3;transition:opacity .25s}
@keyframes goalflash{0%{opacity:0;transform:scale(.85)}8%{opacity:1;transform:scale(1.03)}16%{transform:scale(1)}82%{opacity:1}100%{opacity:0}}
@keyframes goalpulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
.goalfx{position:absolute;inset:0;display:flex;align-items:stretch;justify-content:center;pointer-events:none;z-index:9;overflow:hidden}
.goalfx span{flex:1;display:flex;align-items:center;justify-content:center;gap:.4em;font-family:var(--sbfont,"Barlow Condensed"),"Noto Sans KR",sans-serif;font-weight:700;letter-spacing:.06em;border-radius:4px;animation:goalflash 2.6s ease-out forwards,goalpulse .5s ease-in-out 6;text-shadow:0 3px 14px rgba(0,0,0,.55);white-space:nowrap;text-transform:uppercase}
.stagewrap{position:relative;display:inline-block}
.sbwrap.center + .goalfx,.stagewrap.center{display:block}

/* ticker */
.tickerbar{overflow:hidden;white-space:nowrap;font-family:var(--sbfont,"Barlow Condensed"),"Noto Sans KR",sans-serif;font-weight:700;padding:.35em 0;width:100%}
.tickerbar .tk{display:inline-block;padding-left:100%;animation:tkscroll linear infinite}
@keyframes tkscroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}

/* first-run modal + team panel */
#setupModal{position:fixed;inset:0;background:#0b0e17ee;z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
#setupModal .mbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:520px;width:100%;padding:22px}
#setupModal h2{margin:0 0 6px;font-size:19px}
#setupModal p{margin:0 0 14px;font-size:13px;color:var(--muted);line-height:1.6}
.teamgrid{display:flex;flex-direction:column;gap:6px}
.brow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#141a2b;font-size:13px}
.brow.me{border-color:var(--accent);background:#1b1b3a}
.brow.dup{border-color:#e0553f;background:#3a1a17}
.blive{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.blive.idle{background:#6b7590}
.bname{font-weight:700}
.bmeta{color:var(--muted);font-size:12px}
.bscore{font-family:"Oswald",monospace;font-weight:700;font-size:16px;white-space:nowrap}
.warnbar{background:#3a1a17;border:1px solid #e0553f;color:#ffb3a7;border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:10px}
/* game log */
.logwrap{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:6px;background:#141a2b}
table.logtbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.logtbl th{position:sticky;top:0;background:#1a2033;color:var(--muted);font-weight:700;padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
table.logtbl td{padding:5px 8px;border-bottom:1px solid #2a3350;vertical-align:middle}
table.logtbl tr:hover td{background:#1b2236}
.logtbl .gc{font-family:"Oswald",monospace;font-weight:700;white-space:nowrap}
.logtbl .pd{color:var(--muted);white-space:nowrap}
.logtbl .ty{white-space:nowrap;font-weight:700}
.logtbl .del{cursor:pointer;color:#8b93ad;border:none;background:none;font-size:14px}
.logtbl .del:hover{color:#ff6b6b}
.logempty{padding:24px;text-align:center;color:var(--muted);font-size:13px}
/* 1920x1080 fit stage */
#displayRoot{position:fixed;inset:0;padding:0;margin:0;overflow:hidden}
.fitstage{position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:top left}
.fitstage.preview{background-color:#3a3a3a;
 background-image:linear-gradient(45deg,#4a4a4a 25%,transparent 25%),linear-gradient(-45deg,#4a4a4a 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#4a4a4a 75%),linear-gradient(-45deg,transparent 75%,#4a4a4a 75%);
 background-size:40px 40px;background-position:0 0,0 20px,20px -20px,-20px 0;
 box-shadow:0 0 0 4px rgba(120,150,255,.85),0 0 0 10px rgba(0,0,0,.35)}
.canvaslabel{position:absolute;right:12px;bottom:8px;font-size:24px;font-weight:700;color:#ffffffb0;
 font-family:system-ui,sans-serif;letter-spacing:.02em;pointer-events:none}
.poswrap{position:absolute;inset:0;display:flex}
.tickerhost{position:absolute;left:0;right:0;bottom:0}
#previewBody{position:relative;overflow:hidden}
.sbwrap,.sbwrap *,.fsb,.fsb *,.tickerbar,.tickerbar *,.goalfx span,.goalfx span *{font-weight:var(--sbw,400)}
#audioNotice{position:fixed;left:8px;bottom:8px;background:#000a;color:#fff;padding:6px 10px;border-radius:6px;font-size:12px;font-family:sans-serif;cursor:pointer;z-index:99}
</style>
</head>
<body>

<!-- =================== DISPLAY (OBS) =================== -->
<div id="displayRoot" class="pos-tl" style="display:none"></div>

<div id="toast"></div>
<div id="setupModal"><div class="mbox">
  <h2 data-i18n="setupTitle"></h2>
  <p data-i18n="setupDesc"></p>
  <label class="f" data-i18n="teamKey"></label><input type="text" id="mTeamKey">
  <div class="hint" data-i18n="teamKeyHint"></div>
  <label class="f" data-i18n="boardName"></label><input type="text" id="mBoard" placeholder="rink1">
  <div class="hint" data-i18n="boardNameHint"></div>
  <label class="f" data-i18n="operator"></label><input type="text" id="mOp" placeholder="김하키">
  <button class="btn pri wide" id="mSave" style="margin-top:16px;padding:11px" data-i18n="startBtn"></button>
</div></div>

<!-- =================== CONTROL PANEL =================== -->
<div id="controlRoot">

  <div class="topbar">
    <button class="btn pri" id="btnOpenDisplay">🔴 <span data-i18n="openDisplay"></span></button>
    <button class="btn" id="btnCopyBug">📋 <span data-i18n="copyBug"></span></button>
    <button class="btn" id="btnCopyTicker">📋 <span data-i18n="copyTicker"></span></button>
    <button class="btn" id="btnResetAll">↺ <span data-i18n="resetGame"></span></button>
    <span class="roompill" id="roomPill"></span>
    <a class="btn sm" href="manual.html" target="_blank" style="text-decoration:none">📖 사용 매뉴얼</a>
    <button class="btn sm" id="btnLang">한 / EN</button>
  </div>

  <div class="section">
    <h3><span data-i18n="preview"></span><button class="btn sm" id="btnTogglePrev" data-i18n="hide"></button></h3>
    <div class="body" id="previewBody" style="padding:0"><div id="previewStage" style="width:100%"></div></div>
  </div>

  <div class="ctrlgrid">
    <!-- HOME -->
    <div class="cbox home"><h4 id="ctlHomeName">HOME</h4><div class="b">
      <span class="tag"><span data-i18n="score"></span>: <b id="hScoreTag">0</b></span>
      <button class="bigbtn" data-act="score" data-team="home" data-d="1">+1</button>
      <div class="row2"><button class="subbtn" data-act="score" data-team="home" data-d="-1">-1</button><button class="subbtn" data-act="scorereset" data-team="home">↺ <span data-i18n="reset"></span></button></div>
      <span class="tag"><span data-i18n="sog"></span>: <b id="hSogTag">0</b></span>
      <button class="bigbtn" data-act="sog" data-team="home" data-d="1">+1</button>
      <div class="row2"><button class="subbtn" data-act="sog" data-team="home" data-d="-1">-1</button><button class="subbtn" data-act="sogreset" data-team="home">↺ <span data-i18n="reset"></span></button></div>
      <button class="bigbtn" data-act="addpen" data-team="home" data-i18n="addPenalty"></button>
      <div class="penadd" id="hPenAdd" style="display:none">
        <input type="text" inputmode="numeric" data-penin="home" data-i18n-ph="penNum">
        <div class="row4">

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const now=()=>Date.now();
function parseTime(str){if(typeof str==="number")return str;const p=String(str).trim().split(":");
 if(p.length===2)return (parseInt(p[0]||0)*60+parseFloat(p[1]||0))*1000;return (parseFloat(p[0]||0))*1000}
function fmt(ms,tenths){if(ms<0)ms=0;const total=ms/1000;
 if(tenths&&total>0&&total<60)return (Math.floor(total*10)/10).toFixed(1);
 const m=Math.floor(total/60),s=Math.floor(total%60);return m+":"+String(s).padStart(2,"0")}
function toast(msg,ms){const host=document.getElementById("toast");if(!host){alert(msg);return}
 const d=document.createElement("div");d.textContent=msg;host.appendChild(d);
 setTimeout(()=>{d.style.transition="opacity .3s";d.style.opacity="0";setTimeout(()=>d.remove(),320)},ms||3200)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function rid(){return Math.random().toString(36).slice(2,8)}

/* clock */
function clockLive(){const c=S.live.clock;let ms=c.ms;
 if(c.running){const el=now()-c.at;ms=S.cfg.timer.countUp?ms+el:ms-el}
 return Math.max(0,ms)}
function clockCommit(){const c=S.live.clock;c.ms=clockLive();c.at=now()}
function penRunning(){return S.cfg.timer.penRealtime||S.live.clock.running}
function penLive(p){const el=penRunning()?Math.max(0,now()-(p.at||now())):0;
 return Math.max(0,(p.ms||0)-el)}
function penCommit(){const t=now();["home","away"].forEach(k=>S.live[k].pen.forEach(p=>{p.ms=penLive(p);p.at=t}))}
function activePen(k){return S.live[k].pen.filter(p=>penLive(p)>0)}

/* ================= sync ================= */
const P=new URLSearchParams(location.search);
const VIEW=P.get("view")||"";
const IS_DISPLAY=VIEW==="bug"||VIEW==="ticker"||VIEW==="full";
const slug=v=>String(v||"").toLowerCase().replace(/[^a-z0-9-]/g,"").slice(0,24);
let TEAMKEY=localStorage.getItem("htv_teamkey")||"";
let BOARD=localStorage.getItem("htv_board")||"";
let OPERATOR=localStorage.getItem("htv_operator")||"";
const CLIENTID="htv_"+rid()+rid();
function calcRoom(){return slug(TEAMKEY)+"_"+slug(BOARD)}
let ROOM=P.get("room")||(TEAMKEY&&BOARD?calcRoom():(localStorage.getItem("htv_room")||""));
const TOPIC=n=>"hockeytv/sb/"+ROOM+"/"+n;
const TEAMT=n=>"hockeytv/team/"+slug(TEAMKEY)+"/"+n;
let bc=null;try{bc=new BroadcastChannel("htv_sb_"+ROOM)}catch(e){}
const BROKERS=["wss://broker.emqx.io:8084/mqtt","wss://broker.hivemq.com:8884/mqtt","wss://test.mosquitto.org:8081/mqtt"];
let mq=null,mqReady=false,bIdx=0,connTries=0;
function initMQ(){
 if(!window.mqtt){setNet(false,"no-lib");return}
 const url=BROKERS[bIdx%BROKERS.length];
 try{
  if(mq){try{mq.end(true)}catch(e){}}
  mq=mqtt.connect(url,{clientId:CLIENTID+rid(),reconnectPeriod:0,connectTimeout:7000,clean:true,keepalive:30});
  mq.on("connect",()=>{mqReady=true;connTries=0;setNet(true);
   if(IS_DISPLAY){mq.subscribe(TOPIC("cfg"),{qos:0});mq.subscribe(TOPIC("live"),{qos:0})}
   else{if(TEAMKEY){mq.subscribe(TEAMT("presence/+"),{qos:0});mq.subscribe(TEAMT("preset"),{qos:0})}
    pubCfg();pubLive();pubPresence()}});
  const retry=()=>{mqReady=false;setNet(false);
   connTries++;if(connTries%2===0)bIdx++;
   setTimeout(initMQ,Math.min(15000,2000*connTries))};
  mq.on("close",retry);mq.on("error",()=>{});
  mq.on("message",(tp,pl)=>{
   try{const d=JSON.parse(pl.toString());
    if(!IS_DISPLAY){
     if(tp.endsWith("/preset")){teamPreset=d;return}
     if(tp.indexOf("/presence/")>0){
      if(d&&d.cid&&d.cid!==CLIENTID){peers[d.cid]=d;peers[d.cid].seen=now();renderTeam()}}
     return}
    if(tp.endsWith("/cfg")){S.cfg=d;applyCfgToDisplay()}else if(tp.endsWith("/live")){S.live=d}
    renderAll()}catch(e){}});
 }catch(e){setTimeout(()=>{bIdx++;initMQ()},3000)}
}
function setNet(ok,why){const el=$("#roomPill");if(!el)return;
 el.innerHTML=(ok?"🟢":"🟠")+" "+(why==="no-lib"?"오프라인(동기화 라이브러리 로드 실패)":ROOM.slice(0,10))}
let pubT=null;
function pubLive(){if(IS_DISPLAY)return;S.live.rev++;
 const s=JSON.stringify(S.live);
 if(bc)try{bc.postMessage({k:"live",d:s})}catch(e){}
 if(mq&&mqReady)mq.publish(TOPIC("live"),s,{retain:true,qos:0});
 saveLocal()}
function pubCfg(){if(IS_DISPLAY)return;
 const s=JSON.stringify(S.cfg);
 if(bc)try{bc.postMessage({k:"cfg",d:s})}catch(e){}
 if(mq&&mqReady)mq.publish(TOPIC("cfg"),s,{retain:true,qos:0});
 saveLocal()}
function push(){pubLive();renderAll();if(!IS_DISPLAY)pubPresence()}
function pushCfg(){pubCfg();renderAll()}
if(bc)bc.onmessage=e=>{if(!IS_DISPLAY)return;const {k,d}=e.data||{};
 if(k==="cfg"){S.cfg=JSON.parse(d);applyCfgToDisplay()}else if(k==="live"){S.live=JSON.parse(d)}renderAll()};

function saveLocal(){try{localStorage.setItem("htv_state",JSON.stringify(S))}catch(e){}}
function loadLocal(){try{const r=localStorage.getItem("htv_state");if(!r)return;
 const d=JSON.parse(r);S.cfg=Object.assign(S.cfg,d.cfg||{});
 if(((d.cfg||{}).fv|0)<3){S.cfg.board.font="__same";S.cfg.board.fontKR="Black Han Sans";S.cfg.board.weight=400;S.cfg.fv=3}
 if(d.live){S.live=Object.assign(S.live,d.live);S.live.clock.running=false}
 if(Array.isArray(d.log))S.log=d.log;
 LANG=S.cfg.lang||"ko"}catch(e){}}

/* ================= audio ================= */
let AC=null,userGesture=false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
 if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(freqs,dur,type,vol){const c=ac();if(!c)return;const t0=c.currentTime;
 const g=c.createGain();g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.05);
 g.gain.setValueAtTime(vol,t0+dur-.25);g.gain.linearRampToValueAtTime(0,t0+dur);g.connect(c.destination);
 freqs.forEach(f=>{const o=c.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t0);o.connect(g);o.start(t0);o.stop(t0+dur)})}
let hornAudio=null;
function playHorn(){
 if(S.cfg.audio.data){try{hornAudio=hornAudio||new Audio();hornAudio.src=S.cfg.audio.data;hornAudio.currentTime=0;hornAudio.play().catch(()=>{});return}catch(e){}}
 tone([98,147,196,247],2.6,"sawtooth",.16)}
function playBuzz(){tone([180,181,270],1.8,"square",.14)}

 if(el.textContent!==css)el.textContent=css}

function ppState(){const h=activePen("home").length,a=activePen("away").length;
 if(h>a)return "away";if(a>h)return "home";return null}

function sideHTML(k,row){const c=S.cfg[k],l=S.live[k],b=S.cfg.board;
 const gc=k==="home"?1:2;
 const logo=c.logo?`<img class="sblogo" style="height:${2.15*(c.logoSize/100)}em;width:${2.15*(c.logoSize/100)}em" src="${c.logo}">`:"";
 const rec=(b.showRec&&c.rec)?`<div class="sbrec">(${esc(c.rec)})</div>`:"";
 const sog=b.showSOG?`<div class="sbsog">${t("sog")==="SOG"?"SOG":"SOG"} ${l.sog}</div>`:"";
 return `<div class="sbside" style="background:${c.bg};color:${c.fg};grid-row:${row};grid-column:${gc}">
   ${logo}<div class="sbnamecol"><div class="sbname">${esc(c.name)}</div>${rec}</div>
   <div class="sbscorecol"><div class="sbscore">${l.score}</div>${sog}</div></div>`}

function soRound(){return Math.max(1,S.live.home.so.length,S.live.away.so.length)}
function soHTML(k){const c=S.cfg[k],l=S.live[k];
 const n=Math.max(3,l.so.length);let dots="";
 for(let i=0;i<n;i++){const v=l.so[i];
  const st=v==="hit"?"background:#1db954;box-shadow:0 0 0 2px rgba(255,255,255,.75)"
        :v==="miss"?"background:#e0392b;box-shadow:0 0 0 2px rgba(255,255,255,.75)"
        :"background:transparent;box-shadow:inset 0 0 0 .13em rgba(255,255,255,.5)";
  dots+=`<span class="dot" style="${st}">${v==="hit"?"<b>\u2713</b>":v==="miss"?"<b>\u2715</b>":""}</span>`}
 const hits=l.so.filter(x=>x==="hit").length;
 return `<div class="sbso" style="background:${c.bg}cc;color:${c.fg}"><span class="dots">${dots}</span><b class="socount">${hits}</b></div>`}

function underHTML(k,row){const c=S.cfg[k],l=S.live[k],b=S.cfg.board;let h="";
 if(S.live.shootout)h+=soHTML(k);
 if(l.en)h+=`<div class="sbbanner" style="background:${c.bg}cc;color:${c.fg}">${bt("emptyNet")}</div>`;
 if(l.to)h+=`<div class="sbbanner stripe" style="background:${c.bg}cc;color:${c.fg}">${bt("timeout")}</div>`;
 const pens=activePen(k);
 const pen1=p=>`<div class="sbpen" style="background:${c.bg}cc;color:${c.fg}">${esc(p.num)} &nbsp;-&nbsp; ${fmt(penLive(p))}</div>`;
 if(b.pp){
  const opp=k==="home"?"away":"home",oppPens=activePen(opp);
  if(oppPens.length>pens.length){
   const soonest=Math.min(...oppPens.map(penLive));
   h+=`<div class="sbpen" style="background:${c.bg}cc;color:${c.fg}">${bt("powerplay")} ${fmt(soonest)}</div>`}
 }else h+=pens.map(pen1).join("");
 return `<div class="sbucol" style="grid-row:${row};grid-column:${k==="home"?1:2}">${h}</div>`}

function bugHTML(){const b=S.cfg.board,tm=S.cfg.timer,L=S.live;
 const hasTitle=!!(b.showTitle&&b.title), hasSO=!!L.shootout, hasRep=!!L.replay;
 // row order: [replay] then (default) title→so→main→under  |  (penTop) so→under→main→title
 let r=1; const R={};
 if(hasRep)R.rep=r++;
 if(b.penTop){if(hasSO)R.so=r++;R.under=r++;R.main=r++;if(hasTitle)R.title=r++}
 else{if(hasTitle)R.title=r++;if(hasSO)R.so=r++;R.main=r++;R.under=r++}
 const clockBox=tm.show?`<div class="sbclock" style="background:${b.bg};color:${b.fg};grid-row:${R.main};grid-column:3">
   <div class="sbtime">${L.final?bt("finalTxt"):fmt(clockLive(),true)}</div>
   ${b.showPeriod?`<div class="sbperiod">${L.shootout?bt("shootout"):esc(periodName())}</div>`:""}</div>`:"";
 const title=hasTitle?`<div class="sbtitle" style="background:${b.titleBg};color:${b.titleFg};grid-row:${R.title}">${esc(b.title)}</div>`:"";
 const sobar=hasSO?`<div class="sbtitle" style="background:${b.bg};color:${b.fg};grid-row:${R.so}">${bt("soRoundLabel")}: ${soRound()}</div>`:"";
 const repbar=hasRep?`<div class="sbreplay" style="background:#c81622;color:#fff;grid-row:${R.rep}"><i></i>${bt("replay")}</div>`:"";
 const dim=(hasRep&&b.replayDim!==false)?" dimmed":"";
 const grid=`<div class="sbgrid${dim}">${repbar}${sideHTML("home",R.main)}${sideHTML("away",R.main)}${clockBox}${underHTML("home",R.under)}${underHTML("away",R.under)}${title}${sobar}</div>`;
 return `<div class="sbwrap${b.layout==="bugc"?" center":""}" style="--sbfont:${fontStack()};--sbw:${b.weight||400};font-size:${30*b.scale/100}px">${grid}</div>`}

function fullHTML(){const b=S.cfg.board,tm=S.cfg.timer;
 const T=k=>{const c=S.cfg[k],l=S.live[k];return `<div class="fsbteam" style="background:${c.bg};color:${c.fg}">
   <div class="n">${esc(c.name)}</div><div class="s">${l.score}</div>
   ${b.showSOG?`<div class="sbsog">SOG ${l.sog}</div>`:""}</div>`};
 const pens=["home","away"].map(k=>activePen(k).map(p=>`<span style="color:${S.cfg[k].fg};background:${S.cfg[k].bg};padding:.1em .4em;border-radius:4px;margin:0 .2em">${esc(p.num)} ${fmt(penLive(p))}</span>`).join("")).join("");
 return `<div class="fsb" style="--sbfont:${fontStack()};--sbw:${b.weight||400};font-size:${18*b.scale/100}px;background:${b.bg};color:${b.fg};padding:.6em 1em;border-radius:8px">
  ${b.showTitle&&b.title?`<div style="font-size:1.6em;font-weight:700">${esc(b.title)}</div>`:""}
  <div class="fsbrow">${T("home")}<div class="fsbmid"><div class="t">${S.live.final?bt("finalTxt"):fmt(clockLive(),true)}</div><div class="p">${esc(periodName())}</div></div>${T("away")}</div>
  <div style="font-size:1.2em;font-weight:700">${pens}</div></div>`}

function tickerHTML(){const k=S.cfg.ticker;const txt=(k.text||"").trim();
 if(!S.live.tickerOn||!txt)return "";
 return `<div class="tickerbar" style="background:${k.bg};color:${k.fg};font-size:${28*S.cfg.board.scale/100}px;--sbfont:${fontStack()};--sbw:${S.cfg.board.weight||400}">
  <span class="tk" style="animation-duration:${k.speed}s">${esc(txt)}</span></div>`}

function boardHTML(){return S.cfg.board.layout==="full"?fullHTML():bugHTML()}

const memo={board:null,ticker:null};
const CANVAS_W=1920,CANVAS_H=1080;
function ensureHosts(root){
 if(root.querySelector("#fitStage"))return;
 root.innerHTML=`<div class="fitstage${IS_DISPLAY?"":" preview"}" id="fitStage">
   <div class="poswrap" id="posWrap"><div id="boardHost" class="stagewrap"><div id="boardInner"></div><div class="goalfx" id="goalfx"></div></div></div>
   <div class="tickerhost" id="tickerHost"></div>
   ${IS_DISPLAY?"":'<div class="canvaslabel">1920 &times; 1080 &nbsp;\u2014&nbsp; OBS 화면</div>'}</div>`}
function layoutFit(root){
 const st=root.querySelector("#fitStage");if(!st)return;
 let cw,ch;
 if(IS_DISPLAY){cw=window.innerWidth;ch=window.innerHeight}
 else{cw=root.clientWidth||960;const cap=window.innerWidth<900?Math.max(150,Math.round(window.innerHeight*0.26)):520;
  ch=Math.min(cw*CANVAS_H/CANVAS_W,cap)}
 if(!cw||!ch)return;
 const sc=Math.min(cw/CANVAS_W,ch/CANVAS_H);
 st.style.transform=`translate(${Math.round((cw-CANVAS_W*sc)/2)}px,${Math.round((ch-CANVAS_H*sc)/2)}px) scale(${sc})`;
 if(!IS_DISPLAY){root.style.height=Math.round(CANVAS_H*sc)+"px";root.style.width="100%"}
 const pw=root.querySelector("#posWrap"),b=S.cfg.board;
 const p=b.pos||"tl",m=(b.margin==null?40:b.margin);
 pw.style.padding=m+"px";
 pw.style.alignItems=p[0]==="b"?"flex-end":"flex-start";
 pw.style.justifyContent=p[1]==="c"?"center":p[1]==="r"?"flex-end":"flex-start";
 pw.style.paddingBottom=(p[0]==="b"&&S.live.tickerOn?m+70:m)+"px";
}
function paint(root){
 ensureHosts(root);
 const bh=VIEW==="ticker"?"":boardHTML();
 if(bh!==memo.board){memo.board=bh;root.querySelector("#boardInner").innerHTML=bh}
 const th=tickerHTML();
 if(th!==memo.ticker){memo.ticker=th;root.querySelector("#tickerHost").innerHTML=th}
 layoutFit(root);
}

}
function checkFx(){
 const b=S.cfg.board;
 if(!initedFx){lastScore.home=S.live.home.score;lastScore.away=S.live.away.score;fxSeen={...S.live.fx};initedFx=true;return}
 ["home","away"].forEach(k=>{
  if(S.live[k].score>lastScore[k]){
   const en=k==="home"?b.goalH:b.goalA;
   if(en)goalAnim(k);
   if(S.cfg.audio.on&&S.cfg.audio.horn&&en)playHorn();
  }
  lastScore[k]=S.live[k].score});
 if(S.live.fx.horn!==fxSeen.horn){if(S.cfg.audio.on)playHorn();fxSeen.horn=S.live.fx.horn}
 if(S.live.fx.buzz!==fxSeen.buzz){if(S.cfg.audio.on)playBuzz();fxSeen.buzz=S.live.fx.buzz}
}

 const px=30*b.scale/100;
 el.innerHTML=`<span style="--sbfont:${fontStack()};--sbw:${b.weight||400};background:${c.bg}f2;color:${c.fg};font-size:${px*1.7}px">

  const html=`<div style="display:flex;flex-direction:column;gap:5px;margin-top:6px">

  if(sb.dataset.h!==html){sb.dataset.h=html;sb.innerHTML=html}
  sb.style.display="block";
 }else if(sb.style.display!=="none"){sb.style.display="none";sb.dataset.h=""}
 ["home","away"].forEach(k=>{const pre=k==="home"?"h":"a";
  $("#"+pre+"EnBtn").classList.toggle("on",S.live[k].en);
  $("#"+pre+"ToBtn").classList.toggle("on",S.live[k].to);
  const list=$("#"+pre+"PenList");
  const sig=S.live[k].pen.map(p=>p.id+":"+p.num).join(",");
  if(list.dataset.sig!==sig){list.dataset.sig=sig;
   list.innerHTML=S.live[k].pen.map(p=>`<div class="penrow" data-row="${p.id}">

  S.live[k].pen.forEach(p=>{const el=list.querySelector('[data-row="'+p.id+'"] .ptime');

const peers={};let teamPreset=null,teamMemo="";
function pubPresence(){
 if(IS_DISPLAY||!mq||!mqReady||!TEAMKEY||!BOARD)return;
 const d={cid:CLIENTID,board:slug(BOARD),op:OPERATOR||"",
  h:S.cfg.home.name,a:S.cfg.away.name,hs:S.live.home.score,as:S.live.away.score,
  p:periodName(),run:!!S.live.clock.running,ck:fmt(clockLive()),ts:now()};
 try{mq.publish(TEAMT("presence/"+slug(BOARD)+"-"+CLIENTID),JSON.stringify(d),{qos:0})}catch(e){}}

 list.forEach(p=>{if(p.board===slug(BOARD))dup=true});
 const me={cid:CLIENTID,board:slug(BOARD),op:OPERATOR,h:S.cfg.home.name,a:S.cfg.away.name,
  hs:S.live.home.score,as:S.live.away.score,p:periodName(),run:!!S.live.clock.running,ck:fmt(clockLive())};
 const all=BOARD?[me].concat(list):list;
 const row=(p,isMe)=>`<div class="brow${isMe?" me":""}${(!isMe&&p.board===slug(BOARD))?" dup":""}">
   <span class="blive${p.run?"":" idle"}"></span>

     <div class="bmeta">${esc(p.h)} vs ${esc(p.a)} · ${esc(p.p)} ${esc(p.ck||"")}</div></span>
   <span class="bscore">${p.hs} : ${p.as}</span></div>`;
 const h=all.length?all.map((p,i)=>row(p,BOARD&&i===0)).join(""):`<div class="hint" style="padding:10px">${t("noBoards")}</div>`;
 if(teamMemo!==h){teamMemo=h;g.innerHTML=h}

 const mt=$("#myBoardTag");if(mt)mt.textContent=BOARD?t("myBoard")+": "+slug(BOARD)+(OPERATOR?" ("+OPERATOR+")":""):"";}
setInterval(()=>{pubPresence();if(!IS_DISPLAY)renderTeam()},8000);

/* ---- game log ---- */
function logEv(type,team,detail){
 S.log.push({ts:now(),gc:Math.round(clockLive()),p:S.live.pIdx,type,team:team||"",detail:detail||""});
 if(S.log.length>3000)S.log.shift();
 saveLocal();renderLog()}
function evName(t){return I18N[LANG]["ev"+t.charAt(0).toUpperCase()+t.slice(1)]||t}
function teamName(k){return k?(S.cfg[k]?S.cfg[k].name:k):""}
function pName(i){const p=S.cfg.periods[i];return p?p.n:String(i+1)}
function wallTime(ts){const d=new Date(ts);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0")}
let logMemo="";
function renderLog(){
 const w=$("#logWrap");if(!w)return;
 if(!S.log.length){const h='<div class="logempty">'+t("noLog")+'</div>';
  if(logMemo!==h){logMemo=h;w.innerHTML=h}return}
 const rows=S.log.map((e,i)=>`<tr><td class="gc">${fmt(e.gc)}</td><td class="pd">${esc(pName(e.p))}</td>
  <td class="ty">${esc(evName(e.type))}</td><td>${esc(teamName(e.team))}</td><td>${esc(e.detail)}</td>
  <td class="pd">${wallTime(e.ts)}</td><td><button class="del" data-logdel="${i}">✕</button></td></tr>`).reverse().join("");
 const h=`<table class="logtbl"><thead><tr><th>${t("logTime")}</th><th>${t("logPeriod")}</th><th>${t("logType")}</th>
  <th>${t("logTeam")}</th><th>${t("logDetail")}</th><th>⏱</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
 if(logMemo!==h){logMemo=h;w.innerHTML=h}}

function logFileBase(){const d=new Date();
 const ymd=d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
 const clean=x=>String(x||"").replace(/[\\/:*?"<>|]/g,"").trim()||"team";
 return `${ymd}_${clean(S.cfg.home.name)}_vs_${clean(S.cfg.away.name)}`}
function dl(name,text,mime){
 const blob=new Blob([text],{type:(mime||"text/plain")+";charset=utf-8"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.style.display="none";
 document.body.appendChild(a);a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000)}
function exportCSV(){
 const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
 const head=[t("logPeriod"),t("logTime"),t("logType"),t("logTeam"),t("logDetail"),"실제시각"].map(q).join(",");
 const body=S.log.map(e=>[pName(e.p),fmt(e.gc),evName(e.type),teamName(e.team),e.detail,wallTime(e.ts)].map(q).join(",")).join("\n");
 dl(logFileBase()+".csv","\ufeff"+head+"\n"+body,"text/csv")}
function exportTXT(){
 const H=S.cfg.home.name,A=S.cfg.away.name,L=S.live;
 const g=S.log.filter(e=>e.type==="goal"),pn=S.log.filter(e=>e.type==="pen"),
       so=S.log.filter(e=>e.type==="soHit"||e.type==="soMiss"),nt=S.log.filter(e=>e.type==="note");
 const line=e=>`  ${pName(e.p).padEnd(4," ")} ${fmt(e.gc).padStart(5," ")}  ${teamName(e.team)}  ${e.detail}`;
 let o=`${H}  vs  ${A}\n${new Date().toLocaleString()}\n${"=".repeat(46)}\n`;
 o+=`${t("sumScore")}: ${L.home.score} - ${L.away.score}\n${t("sumSOG")}: ${L.home.sog} - ${L.away.sog}\n`;
 if(g.length){o+=`\n[${t("sumGoals")}]\n`+g.map(line).join("\n")+"\n"}
 if(pn.length){o+=`\n[${t("sumPens")}]\n`+pn.map(line).join("\n")+"\n"}
 if(so.length){const hit=k=>so.filter(e=>e.team===k&&e.type==="soHit").length,tot=k=>so.filter(e=>e.team===k).length;
  o+=`\n[${t("sumSO")}]\n  ${H} ${hit("home")}/${tot("home")}   ${A} ${hit("away")}/${tot("away")}\n`}
 if(nt.length){o+=`\n[${t("sumNotes")}]\n`+nt.map(line).join("\n")+"\n"}
 dl(logFileBase()+".txt",o)}
function exportJSON(){
 dl(logFileBase()+".json",JSON.stringify({home:S.cfg.home.name,away:S.cfg.away.name,
  score:[S.live.home.score,S.live.away.score],sog:[S.live.home.sog,S.live.away.sog],
  periods:S.cfg.periods,log:S.log},null,1),"application/json")}

/* ---- actions ---- */
function act(a,k,d,ev){
 switch(a){
  case "score":{const before=S.live[k].score;S.live[k].score=Math.max(0,before+d);
    if(S.live[k].score!==before)logEv(d>0?"goal":"goalCancel",k,`${S.live.home.score}-${S.live.away.score}`);break}
  case "scorereset":S.live[k].score=0;break;
  case "sog":S.live[k].sog=Math.max(0,S.live[k].sog+d);break;
  case "sogreset":S.live[k].sog=0;break;
  case "addpen":addPenalty(k);return;
  case "en":S.live[k].en=!S.live[k].en;logEv(S.live[k].en?"eN":"eNoff",k,"");break;
  case "to":S.live[k].to=!S.live[k].to;if(S.live[k].to)logEv("timeout",k,"");break;
  case "clock":{clockCommit();S.live.clock.ms=Math.max(0,S.live.clock.ms+d*1000);break}
  case "clockreset":{S.live.clock.running=false;const p=S.cfg.periods[S.live.pIdx];
    const target=S.cfg.timer.countUp?0:parseTime(p?p.len:"20:00");
    S.live.clock.ms=target;S.live.clock.at=now();
    if(!S.cfg.timer.countUp&&!target)toast(t("soPeriodWarn").replace("%s",p?p.n:"?"),5200);
    break}
  case "buzzer":S.live.fx.buzz++;if(!IS_DISPLAY&&S.cfg.audio.on)playBuzz();break;
  case "horn":S.live.fx.horn++;if(!IS_DISPLAY&&S.cfg.audio.on)playHorn();break;
  case "period":{clockCommit();
    const ni=Math.max(0,Math.min(S.cfg.periods.length-1,S.live.pIdx+d));S.live.pIdx=ni;
    if(!S.live.clock.running){const p=S.cfg.periods[ni];S.live.clock.ms=S.cfg.timer.countUp?0:parseTime(p.len);S.live.clock.at=now()}
    logEv("period","",pName(ni));break}
  case "periodreset":{S.live.pIdx=0;S.live.clock.running=false;
    S.live.clock.ms=S.cfg.timer.countUp?0:parseTime(S.cfg.periods[0].len);S.live.clock.at=now();S.live.final=false;break}
  case "final":S.live.final=!S.live.final;if(S.live.final)logEv("final","",`${S.live.home.score}-${S.live.away.score}`);break;
  case "ticker":S.live.tickerOn=!S.live.tickerOn;break;
  case "replay":S.live.replay=!S.live.replay;break;
  case "shootout":{
    const on=!S.live.shootout;
    penCommit();clockCommit();
    if(on){
     S.live.prev={p:S.live.pIdx,ms:S.live.clock.ms};
     const i=S.cfg.periods.findIndex(p=>/^(so|shootout|슛|승부)/i.test(p.n));
     if(i>=0){S.live.pIdx=i;S.live.clock.running=false;
      S.live.clock.ms=S.cfg.timer.countUp?0:parseTime(S.cfg.periods[i].len);S.live.clock.at=now()}
    }else if(S.live.prev){
     S.live.pIdx=S.live.prev.p;S.live.clock.ms=S.live.prev.ms;
     S.live.clock.running=false;S.live.clock.at=now();S.live.prev=null;
     toast(t("soRestored"));
    }
    S.live.shootout=on;break}
 }
 push()}

  S.live.clock.ms=e.target.checked?0:parseTime(S.cfg.periods[S.live.pIdx].len);S.live.clock.at=now();pubLive();pushCfg()};
 cb("#audioOn",v=>S.cfg.audio.on=v);cb("#hornOn",v=>S.cfg.audio.horn=v);
 $("#tickerSpeed").oninput=e=>{S.cfg.ticker.speed=Math.max(5,parseInt(e.target.value||25));pushCfg()};
 $("#hornFile").onchange=e=>{const f=e.target.files[0];if(!f)return;
  if(f.size>1100000){toast(LANG==="ko"?"1MB 이하 파일만 가능합니다.":"File must be under 1MB");return}
  const r=new FileReader();r.onload=()=>{S.cfg.audio.data=r.result;pushCfg()};r.readAsDataURL(f)};
 $("#hornDel").onclick=()=>{S.cfg.audio.data=null;hornAudio=null;pushCfg()};
 $("#addPeriod").onclick=()=>{S.cfg.periods.push({n:"P"+(S.cfg.periods.length+1),len:"20:00"});renderPeriods();pushCfg()};
 $("#periodEditor").addEventListener("input",e=>{const el=e.target;if(!el.dataset.p)return;
  const i=+el.dataset.i;if(el.dataset.p==="n")S.cfg.periods[i].n=el.value;else S.cfg.periods[i].len=el.value;pushCfg()});
 $("#periodEditor").addEventListener("click",e=>{const el=e.target.closest('[data-p="del"]');if(!el)return;
  if(S.cfg.periods.length<=1)return;S.cfg.periods.splice(+el.dataset.i,1);
  S.live.pIdx=Math.min(S.live.pIdx,S.cfg.periods.length-1);renderPeriods();pubLive();pushCfg()});
 $("#btnExport").onclick=()=>{const blob=new Blob([JSON.stringify(S.cfg,null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="hockeytv-scoreboard-config.json";a.click()};
 $("#btnImport").onclick=()=>$("#importFile").click();
 $("#importFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{S.cfg=JSON.parse(r.result);LANG=S.cfg.lang||"ko";applyI18N();fillSetup();pushCfg()}catch(x){alert("JSON error")}};r.readAsText(f)};
}
function pair(cid,tid,fn){const c=$(cid),x=$(tid);
 c.oninput=e=>{x.value=e.target.value;fn(e.target.value);pushCfg()};
 x.onchange=e=>{c.value=e.target.value;fn(e.target.value);pushCfg()}}
const FONTS={
 kr:[["Black Han Sans","검은고딕 Black Han Sans"],["Noto Sans KR","본고딕 Noto Sans KR"],["KotraBold","코트라 볼드체 KOTRA Bold"],["KotraDoYak","코트라 도약체"],
     ["KotraHope","코트라 희망체"],["JalnanGothic","여기어때 잘난체 고딕"],["Jalnan","여기어때 잘난체"],
     ["Gothic A1","고딕 A1"],["Do Hyeon","도현"],["Jua","주아"],
     ["Nanum Gothic","나눔고딕"],["Song Myung","송명 (명조)"]],
 en:[["Barlow Condensed","Barlow Condensed"],["Oswald","Oswald"],["Bebas Neue","Bebas Neue"],
     ["Anton","Anton"],["Archivo Black","Archivo Black"],["Roboto Condensed","Roboto Condensed"]]};
function buildFontSelects(){
 const grp=(label,list)=>{const g=document.createElement("optgroup");g.label=label;
  list.forEach(([v,n])=>{const o=document.createElement("option");o.value=v;o.textContent=n;
   o.style.fontFamily=`'${v}','Noto Sans KR',sans-serif`;g.appendChild(o)});return g};
 const L=LANG==="ko";
 [["#fontSel",true],["#fontKRSel",false]].forEach(([id,same])=>{
  const sel=$(id);if(!sel)return;const keep=sel.value;sel.innerHTML="";
  if(same){const o=document.createElement("option");o.value="__same";
   o.textContent=L?"↑ 한글 글꼴과 동일하게":"Same as Korean font";sel.appendChild(o)}
  sel.appendChild(grp(L?"한글 글꼴":"Korean",FONTS.kr));
  sel.appendChild(grp(L?"영문·숫자 전용":"Latin only",FONTS.en));
  if(keep)sel.value=keep});
 addCustomOptions()}
function addCustomOptions(){const has=!!(S.cfg.board.customUrl||"").trim();
 ["#fontSel","#fontKRSel"].forEach(id=>{const sel=$(id);if(!sel)return;
  let o=sel.querySelector('option[value="CustomFont"]');
  if(has&&!o){o=document.createElement("option");o.value="CustomFont";
   o.textContent=LANG==="ko"?"직접 추가한 글꼴":"Custom font";sel.appendChild(o)}
  else if(!has&&o)o.remove()})}
function teamDB(){try{return JSON.parse(localStorage.getItem("htv_teams")||"{}")}catch(e){return{}}}
function shrink(file,max,cb){const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{
  let{width:w,height:h}=im;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
  const cv=document.createElement("canvas");cv.width=w;cv.height=h;
  cv.getContext("2d").drawImage(im,0,0,w,h);cb(cv.toDataURL("image/png"))};
  im.onerror=()=>cb(r.result);im.src=r.result};
 r.readAsDataURL(file)}

boot();
</script>
